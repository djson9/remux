name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: ${{ vars.IOS_DEVELOPER_DIR }}

jobs:
  changes:
    name: Changes
    runs-on: middesk-linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Detect app changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            printf 'app=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          app_changed=false
          while IFS= read -r path; do
            case "${path}" in
              remux-site/*|docs/*|README.md|LICENSE)
                ;;
              *)
                app_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          printf 'app=%s\n' "${app_changed}" >> "${GITHUB_OUTPUT}"

  site:
    name: Site
    runs-on: middesk-linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          node --check remux-site/script.js

          python3 - <<'PY'
          import pathlib,re
          root = pathlib.Path('remux-site')
          for asset in set(re.findall(r'assets/[^"?]+', (root / 'index.html').read_text())):
              assert (root / asset).is_file(), f'Missing site asset: {asset}'
          PY

      - name: Validate OTA packaging and shell scripts
        run: |
          python3 -m unittest discover -s scripts/ios -p 'test_*.py'
          bash -n scripts/ios/build-signed.sh

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: middesk-macos
    timeout-minutes: 25

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -d "${DEVELOPER_DIR}"
          xcodebuild -version

      - name: Test authorized-key installer
        shell: bash
        run: scripts/test_install_authorized_key.sh

      - name: Create simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable == true and .platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last.identifier')"
          test -n "${runtime_id}"
          udid="$(xcrun simctl create "Remux CI ${GITHUB_RUN_ID}" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "${runtime_id}")"
          printf 'udid=%s\n' "${udid}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${udid}"

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        shell: bash
        run: |
          set -euo pipefail
          zip_path="${RUNNER_TEMP}/xcodegen.zip"
          curl --fail --location --silent --show-error --output "${zip_path}" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"

          actual_sha256="$(shasum -a 256 "${zip_path}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${XCODEGEN_SHA256}" ]]; then
            printf 'Checksum mismatch for XcodeGen %s.\n  expected: %s\n  actual:   %s\n' \
              "${XCODEGEN_VERSION}" "${XCODEGEN_SHA256}" "${actual_sha256}" >&2
            exit 1
          fi

          ditto -x -k "${zip_path}" "${RUNNER_TEMP}"
          printf '%s\n' "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/xcodegen/bin/xcodegen" --version

      - name: Fetch GhosttyKit
        shell: bash
        run: scripts/fetch_ghosttykit.sh

      - name: Verify GhosttyKit
        env:
          CONFIGURATION: Release
          GHOSTTYKIT_XCFRAMEWORK: ${{ github.workspace }}/../ghostty-remux-upstream-rebuild/macos/GhosttyKit.xcframework
        shell: bash
        run: |
          set -euo pipefail
          scripts/fetch_ghosttykit.sh --verify
          scripts/verify_ghosttykit_release_mode.sh

      - name: Verify generated Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --exit-code -- Remux.xcodeproj

      - name: Build UI tests
        shell: bash
        run: xcodebuild build-for-testing -project Remux.xcodeproj -scheme RemuxUIOnly -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -jobs 4

      - name: Wait for simulator
        shell: bash
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/RemuxUnitTests.xcresult"
          xcodebuild test -project Remux.xcodeproj -scheme Remux -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -jobs 4 -only-testing:RemuxTests -resultBundlePath "${RUNNER_TEMP}/RemuxUnitTests.xcresult"

      - name: Delete simulator
        if: always() && steps.simulator.outputs.udid != ''
        shell: bash
        run: xcrun simctl delete "${{ steps.simulator.outputs.udid }}"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: remux-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
